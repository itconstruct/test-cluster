apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bytestash
  namespace: bytestash
spec:
  interval: 15m
  chart:
    spec:
      chart: bytestash
      version: 1.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    service:
      main:
        type: LoadBalancer
        loadBalancerIP: "${BYTESTASH_IP}"
    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          traefik:
            enabled: false
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
        hosts:
          - host: bytestash.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
    env:
      JWT_SECRET: "${BYTESTASH_JWT}"
