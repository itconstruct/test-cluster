apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netprobe
  namespace: netprobe
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 15.24.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    main:
      repository: plaintextpackets/netprobe
      #repository: ghcr.io/plaintextpackets/netprobe_lite
      tag: 1.4.3
      pullPolicy: IfNotPresent
    service:
      main:
        type: ClusterIP
        ports:
          main:
            port: 3001
            targetPort: 3000
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
        hosts:
          - host: netprobe.${DOMAIN_0}
    credentials:
      s3:
        type: s3
        url: "${S3URL}"
        bucket: "${S3PREFIX}-netprobe"
        accessKey: "${S3ID}"
        secretKey: "${S3KEY}"
        encrKey: "${S3KEY}"
    persistence:
      grafana:
        enabled: true
        mountPath: /var/lib/grafana
        targetSelector:
          grafana:
            grafana: {}
      netprobe:
        enabled: true
        mountPath: /netprobe_lite
      prometheus:
        enabled: true
        targetSelector:
          prometheus:
            mountPath: /prometheus
          prometheus_config:
            mountPath: /etc/prometheus/prometheus.yml
      redis:
        enabled: true
        mountPath: /etc/redis/redis.conf
        targetSelector:
          redis:
            redis: {}
    portal:
      open:
        enabled: true
    securityContext:
      container:
        runAsUser: 0
        runAsGroup: 0
        readOnlyRootFilesystem: false
    metrics:
      main:
        enabled: true
        type: "servicemonitor"
        endpoints:
          - port: main
            path: /prometheus
            interval: 1h
            scrapeTimeout: 60s
        prometheusRule:
          enabled: false
    configmap:
      dashboard:
        enabled: true
        labels:
          grafana_dashboard: "1"
        data:
          netprobe.json: >-
            {{ .Files.Get "netprobe.json" | indent 8 }}
